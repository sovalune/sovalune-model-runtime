name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libnats-dev
      
      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -DSOVALUNE_CPU_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: |
          cd build
          cmake --build . -j$(nproc)
      
      - name: Test
        run: |
          cd build
          ./sovalune-model-runtime --version

  build-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda-version: '12.3'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libnats-dev
      
      - name: Configure
        run: |
          mkdir build-cuda
          cd build-cuda
          cmake .. -DSOVALUNE_USE_CUDA=ON -DSOVALUNE_CPU_ONLY=OFF -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: |
          cd build-cuda
          cmake --build . -j$(nproc)
      
      - name: Test
        run: |
          cd build-cuda
          ./sovalune-model-runtime --version

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
      
      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -DSOVALUNE_CPU_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: |
          cd build
          cmake --build . --config Release
      
      - name: Test
        run: |
          cd build
          Release\sovalune-model-runtime.exe --version
