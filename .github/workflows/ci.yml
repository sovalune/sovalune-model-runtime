name: CI/CD - Model Runtime

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install NATS C client
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/nats-io/nats.c.git
          cd nats.c
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DSOVALUNE_CPU_ONLY=ON

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Test
        run: |
          cd build
          ./sovalune-model-runtime --help
